<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Hunter × Hunter 天氣預報</title>
<style>
    body {
        background: #0f1524;
        color: #fff;
        font-family: "Trebuchet MS","微軟正黑體";
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }
    .card {
        width: 350px;
        background: rgba(255,255,255,0.1);
        border: 2px solid #7effa9;
        border-radius: 15px;
        padding: 25px;
        text-align:center;
        box-shadow: 0 0 15px #7effa9;
    }
    .title{
        font-size:26px;
        font-weight:bold;
        color:#7effa9;
        text-shadow:0 0 8px #7effa9;
    }
    .quote{
        margin-top:10px;
        font-size:15px;
        font-style:italic;
        opacity:.9;
    }
    button{
        margin-top:18px;
        padding:10px 18px;
        border:none;
        background:#7effa9;
        color:#000;
        font-weight:bold;
        border-radius:10px;
        cursor:pointer;
        transition:.2s;
    }
    button:hover{ transform:scale(1.05); }
    .info{
        margin-top:16px;
        font-size:14px;
        line-height:1.5;
    }
</style>
</head>

<body>
<div class="card">
    <div class="title">🟢 Hunter 天氣偵察</div>
    <div id="weather" class="info">讀取中...</div>
    <div id="quote" class="quote"></div>
    <button onclick="fetchWeather()">重新偵查天氣</button>
</div>

<script>
const API_URL = "https://cwaweather-backend-001.zeabur.app/api/weather/kaohsiung";

function getHunterQuote(weather, rain) {
    if (parseInt(rain) > 40) return "🌧 這場雨彷彿獵人的試煉…凡人最好帶傘。";
    if (weather.includes("晴")) return "☀ 這種天氣彷彿小傑訓練時的笑容，充滿希望！";
    if (weather.includes("陰")) return "☁ 陰沉的天…像西索等待獵物般詭異呢。";
    return "🌫 無法判定…這感覺像揍敵客家的寂靜。";
}

async function fetchWeather(){
    document.getElementById("weather").innerHTML="偵測中...";
    try{
        const res = await fetch(API_URL);
        const data = await res.json();

        const now = data.data.forecasts[0];
        const text = `
            📍 位置：${data.data.city}<br>
            🕒 ${now.startTime} ~ ${now.endTime}<br>
            天氣：${now.weather}<br>
            🌡 ${now.minTemp} ~ ${now.maxTemp}<br>
            💧 降雨：${now.rain}<br>
            風速：${now.windSpeed}
        `;
        document.getElementById("weather").innerHTML = text;
        document.getElementById("quote").innerHTML = getHunterQuote(now.weather, now.rain);

    }catch(e){
        document.getElementById("weather").innerHTML="❌ 無法取得天氣";
    }
}

fetchWeather();
</script>
</body>
</html>
